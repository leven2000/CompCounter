name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Migraciones, lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: compcounter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/compcounter_ci
      AUTH_SECRET: ci-secreto-descartable-no-usar-en-produccion
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Aplicar las migraciones desde cero
        run: npx prisma migrate deploy

      - name: Verificar que el esquema no cambió sin migración
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Lint
        run: npm run lint

      - name: Pruebas de puntaje y sanciones
        run: npm run probar:puntaje

      - name: Pruebas de la carga desde Excel
        run: npm run probar:importacion

      - name: Pruebas de los controles de jueces
        run: npm run probar:controles

      - name: Pruebas de las copias de seguridad
        run: npm run probar:copias

      - name: Pruebas de las llaves
        run: npm run probar:llaves

      - name: Generar los tipos de rutas
        run: npx next typegen

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
